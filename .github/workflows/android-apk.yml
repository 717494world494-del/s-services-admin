name: Build S SERVICES APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK and Build Tools
        run: |
          # Android Command Line Tools download aur setup
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d temp_tools
          mv temp_tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          rm -rf cmdline-tools.zip temp_tools

          # Environment variables set karna
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

          # Licenses accept karna aur zaroori packages install karna
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract project ZIP
        run: |
          test -f SServicesProjectUpload.zip || {
            echo "ERROR: SServicesProjectUpload.zip was not found in the repository root."
            exit 1
          }
          mkdir -p project
          unzip -oq SServicesProjectUpload.zip -d project
          echo "Files extracted:"
          find project -maxdepth 4 -type f | head -200

      - name: Find Android project and Setup Gradle Wrapper
        shell: bash
        run: |
          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."
            echo "The ZIP may not contain a complete Android Gradle project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S-SERVICES-APK
          path: project/**/*.apk
          if-no-files-found: error
          
